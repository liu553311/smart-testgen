[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-testgen"
version = "1.0.0"
description = "AI-powered test case generator for software testers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "liu553311", email = "1013162556@qq.com"},
]
keywords = ["testing", "test-case", "ai", "automation", "qa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "anthropic>=0.50.0,<1.0.0",
    "openai>=1.0.0,<3.0.0",
    "click>=8.0,<9.0",
    "pydantic>=2.0,<3.0",
    "rich>=13.0,<16.0",
    "python-dotenv>=1.0,<2.0",
    "jinja2>=3.1,<4.0",
    "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
smart-testgen = "smart_testgen.cli.main:cli"

[project.urls]
Homepage = "https://github.com/liu553311/smart-testgen"
Repository = "https://github.com/liu553311/smart-testgen"
Issues = "https://github.com/liu553311/smart-testgen/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
